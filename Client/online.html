<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MurMur — Connecting</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="loading-screen">

        <div class="loading-icon">

            <span></span>
            <span></span>
            <span></span>

        </div>

        <h1>
            MurMur
        </h1>

        <p>
            Preparing MurMur...
        </p>

    </main>


    <script>

        setTimeout(function () {

            /*
             * Detect whether the device is primarily
             * a mobile / tablet device.
             */

            const isMobile =
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
                    .test(
                        navigator.userAgent
                    );


            if (isMobile) {

                /*
                 * Mobile / tablet
                 */

                window.location.href =
                    "site-mob-login.html";

            } else {

                /*
                 * Desktop / laptop
                 */

                window.location.href =
                    "site-pc-login.html";

            }

        }, 750);

    </script>


    <script src="js/app.js"></script>

</body>

</html>
