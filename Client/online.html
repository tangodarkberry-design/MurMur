    <script>

        function detectDevice() {

            const userAgent = navigator.userAgent.toLowerCase();

            const isMobile =
                /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i
                .test(userAgent);

            if (isMobile) {

                window.location.href = "site-mob-login.html";

            } else {

                window.location.href = "site-pc-login.html";

            }
        }

        setTimeout(detectDevice, 750);

    </script>

    <script src="js/app.js"></script>
