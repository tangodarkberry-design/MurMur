
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MurMur — Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="login-screen">

        <div class="login-container">

            <h1>MurMur</h1>

            <p class="login-subtitle">
                Welcome back.
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit">
                    Log In
                </button>

                <p id="loginError" class="login-error"></p>

            </form>

            <p class="create-account">
                Don't have an account?
                <a href="#">Create one</a>
            </p>

        </div>

    </main>


    <script>

        const SERVER_URL =
            "https://randy-bill-charter-workshop.trycloudflare.com";


        /*
         * Detect whether MurMur should use
         * the mobile or PC interface.
         *
         * This checks:
         *
         * 1. Phone/tablet user agents
         * 2. Touch capability
         * 3. Screen width
         *
         * This also works with Firefox Responsive
         * Design Mode.
         */

        function isMobileDevice() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera ||
                "";

            const mobileUserAgent =
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i
                    .test(userAgent);


            const touchDevice =
                navigator.maxTouchPoints > 0;


            const smallScreen =
                window.matchMedia("(max-width: 768px)").matches;


            /*
             * A real mobile device should always
             * use the mobile interface.
             */

            if (mobileUserAgent) {
                return true;
            }


            /*
             * Touch + small screen is also treated
             * as mobile/tablet.
             */

            if (touchDevice && smallScreen) {
                return true;
            }


            /*
             * Small viewport fallback.
             *
             * This is particularly useful for
             * Firefox Responsive Design Mode.
             */

            if (smallScreen) {
                return true;
            }


            return false;
        }


        const loginForm =
            document.getElementById("loginForm");


        const loginError =
            document.getElementById("loginError");


        const loginButton =
            loginForm.querySelector("button");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                loginError.textContent = "";


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                try {

                    const response =
                        await fetch(
                            `${SERVER_URL}/api/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username: username,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        loginError.textContent =
                            data.message ||
                            "Invalid username or password.";

                        return;
                    }


                    /*
                     * Store account information.
                     */

                    sessionStorage.setItem(
                        "murmur_username",
                        data.username
                    );


                    sessionStorage.setItem(
                        "murmur_display_name",
                        data.displayName
                    );


                    /*
                     * Detect the device AFTER
                     * successful authentication.
                     */

                    const isMobile =
                        isMobileDevice();


                    console.log(
                        "MurMur device:",
                        isMobile
                            ? "MOBILE"
                            : "PC"
                    );


                    /*
                     * First-time password setup.
                     *
                     * This ALWAYS uses the PC
                     * welcome page, regardless
                     * of device.
                     */

                    if (data.mustChangePassword) {

                        window.location.href =
                            "site-pc-welcome.html";

                        return;
                    }


                    /*
                     * First-time profile setup.
                     */

                    if (data.firstStartup) {

                        if (isMobile) {

                            window.location.href =
                                "site-mob-first-startup.html";

                        } else {

                            window.location.href =
                                "site-pc-first-startup.html";

                        }

                        return;
                    }


                    /*
                     * Normal login.
                     */

                    if (isMobile) {

                        window.location.href =
                            "site-mob.html";

                    } else {

                        window.location.href =
                            "site-pc.html";

                    }

                }

                catch (error) {

                    console.error(
                        "MurMur login error:",
                        error
                    );


                    loginError.textContent =
                        "Unable to connect to the MurMur server.";

                }

                finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Log In";

                }

            }
        );

    </script>


    <script src="js/app.js"></script>

</body>

</html>
