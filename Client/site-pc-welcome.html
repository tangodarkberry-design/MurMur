<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MurMur — Welcome</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="welcome-screen">

        <div class="welcome-container">

            <h1 id="welcomeTitle">
                Welcome.
            </h1>

            <p class="welcome-message">
                Tango has given you this account, but it could use some work.
                First of all, set your own password instead of the password
                that was given to you.
            </p>

            <form id="passwordForm">

                <div class="input-group">

                    <label for="newPassword">
                        New password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button type="submit">
                    Set Password
                </button>

                <p id="passwordError" class="login-error"></p>

            </form>

        </div>

    </main>


    <script>

        /* =========================================================
        MurMur Server
        ========================================================= */

        const SERVER_URL =
            "https://picked-suggested-prisoner-yard.trycloudflare.com";


        /* =========================================================
        Session
        ========================================================= */

        const username =
            sessionStorage.getItem(
                "murmur_username"
            );


        /* =========================================================
        Elements
        ========================================================= */

        const welcomeTitle =
            document.getElementById(
                "welcomeTitle"
            );

        const passwordForm =
            document.getElementById(
                "passwordForm"
            );

        const passwordError =
            document.getElementById(
                "passwordError"
            );

        const submitButton =
            passwordForm.querySelector(
                "button"
            );

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        /* =========================================================
        Check Login
        ========================================================= */

        if (!username) {

            /*
            * There is no logged-in username.
            * Send the user back to the login page.
            */

            window.location.href =
                "site-pc-login.html";

        }
        else {

            /*
            * User is logged in.
            * This page is specifically the first-startup
            * password-change page, so there is no reason to
            * redirect based on firstStartup here.
            */

            welcomeTitle.textContent =
                `Welcome, ${username}.`;

        }


        /* =========================================================
        Change Password
        ========================================================= */

        passwordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* -------------------------------------------------
                Clear Previous Error
                ------------------------------------------------- */

                passwordError.textContent = "";


                /* -------------------------------------------------
                Make Sure User Is Logged In
                ------------------------------------------------- */

                if (!username) {

                    passwordError.textContent =
                        "You are not logged in.";

                    return;

                }


                /* -------------------------------------------------
                Get Passwords
                ------------------------------------------------- */

                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                /* -------------------------------------------------
                Password Match
                ------------------------------------------------- */

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    passwordError.textContent =
                        "The passwords do not match.";

                    return;

                }


                /* -------------------------------------------------
                Password Length
                ------------------------------------------------- */

                if (
                    newPassword.length < 8
                ) {

                    passwordError.textContent =
                        "Password must be at least 8 characters.";

                    return;

                }


                /* -------------------------------------------------
                Prevent Empty / Whitespace Password
                ------------------------------------------------- */

                if (
                    newPassword.trim().length < 8
                ) {

                    passwordError.textContent =
                        "Password must be at least 8 characters.";

                    return;

                }


                /* -------------------------------------------------
                Disable Form
                ------------------------------------------------- */

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Setting password...";


                newPasswordInput.disabled =
                    true;

                confirmPasswordInput.disabled =
                    true;


                /* -------------------------------------------------
                Send Password Change Request
                ------------------------------------------------- */

                try {

                    const response =
                        await fetch(
                            `${SERVER_URL}/api/change-password`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        newPassword:
                                            newPassword

                                    })
                            }
                        );


                    /* -------------------------------------------------
                    Try To Read Server Response
                    ------------------------------------------------- */

                    let data = {};

                    try {

                        data =
                            await response.json();

                    }
                    catch {

                        data = {};

                    }


                    console.log(
                        "Change password response:",
                        response.status,
                        data
                    );


                    /* -------------------------------------------------
                    Server Rejected Request
                    ------------------------------------------------- */

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        passwordError.textContent =
                            data.message ||
                            "Unable to change your password.";

                        return;

                    }


                    /* =================================================
                    Password Successfully Changed
                    ================================================= */

                    /*
                    * IMPORTANT:
                    *
                    * Keep murmur_username because site-pc.html
                    * uses it to know who is logged in.
                    */

                    sessionStorage.setItem(
                        "murmur_username",
                        username
                    );


                    /*
                    * The temporary-password / first-startup
                    * state has now been completed.
                    */

                    sessionStorage.removeItem(
                        "firstStartup"
                    );


                    /*
                    * Clear the password fields.
                    */

                    newPasswordInput.value = "";
                    confirmPasswordInput.value = "";


                    /*
                    * Enter MurMur.
                    */

                    window.location.href =
                        "site-pc.html";

                }


                /* -------------------------------------------------
                Connection Error
                ------------------------------------------------- */

                catch (error) {

                    console.error(
                        "Password change failed:",
                        error
                    );

                    passwordError.textContent =
                        "Unable to connect to the MurMur server.";

                }


                /* -------------------------------------------------
                Re-enable Form
                ------------------------------------------------- */

                finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Set Password";

                    newPasswordInput.disabled =
                        false;

                    confirmPasswordInput.disabled =
                        false;

                }

            }
        );


    </script>

    <!-- MurMur global JavaScript -->

    <script src="js/app.js"></script>

</body>

</html>
